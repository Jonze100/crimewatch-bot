app = 'crimewatch-bot'
primary_region = 'fra'

[build]

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[checks]
  [checks.alive]
    type = "http"
    interval = "30s"
    timeout = "10s"
    path = "/health"
    grace_period = "30s"
    port = 8080
